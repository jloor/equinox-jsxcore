# CI for the Equinox -> JsxCore migration.
#
# Branch is master, not main. The upstream fork's default branch is master, and the
# original plan's workflow triggered on main - it would never have fired.
#
# Everything .NET runs INSIDE a Node-free container, never directly on the runner. The
# ubuntu runner ships Node 22 and npm 10 preinstalled, so a build there would succeed
# whether or not JsxCore actually needs them, silently invalidating the central claim of
# this project. scripts/Dockerfile.verify hard-fails if node or npm are ever present.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify (development)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Node-free verify image
        run: docker build -f scripts/Dockerfile.verify -t equinox-verify:9.0 .

      - name: Prove the build environment has no Node
        run: |
          docker run --rm equinox-verify:9.0 bash -c '
            for t in node npm npx yarn pnpm; do
              if command -v $t >/dev/null 2>&1; then echo "FATAL: $t present" >&2; exit 1; fi
            done
            echo "no JS tooling on PATH; dotnet $(dotnet --version)"
          '

      # Equinox ships 7 architecture tests enforcing layer boundaries. Worth running
      # precisely because this project deliberately edited the infrastructure layer
      # twice (D11, D13) - these say whether the layering itself still holds.
      - name: Architecture tests
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            equinox-verify:9.0 dotnet test --verbosity quiet

      # 15 checks: build, warnings-vs-baseline, view conversion, "use server" on every
      # view, and full Customer CRUD through antiforgery-protected forms as a
      # registered user. Exits non-zero if any fail.
      - name: Run verification oracle
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            equinox-verify:9.0 ./scripts/verify.sh

  publish:
    name: Build and publish image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN can push to ghcr.io; no PAT needed.
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA as well as latest. Deploying by immutable SHA is what
      # makes the rollout idempotent and lets a rollback be the same call with the
      # previous tag, rather than hoping :latest points somewhere sane.
      - name: Build image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .

      # Production-only smoke test. Everything that broke while containerising was
      # invisible in development: the provider fell back to SQL Server, no schema was
      # created, and unconfigured social-auth options threw on every request after a
      # completely clean startup. This runs the real image and fetches real pages.
      - name: Smoke test the built image
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: ./scripts/smoke-image.sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '`'"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"'`'
            echo ""
            echo "Verified in development (15 checks) and smoke-tested in production mode."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Bunny Magic Containers
    needs: publish
    # Skipped entirely until the Bunny variables exist, so the pipeline stays green
    # before the account is wired up instead of failing on a missing secret. Once
    # BUNNY_APP_ID is set as a repository variable, this starts running on its own.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.BUNNY_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs BEFORE the rollout, so a misconfigured app is never deployed into.
      #
      # Asserts 1 replica, 1 region, and a volume at /data. Bunny gives each pod its own
      # volume and SQLite is single-writer, so a second replica silently produces a
      # second database - no error, no log, just users seeing different data depending
      # on which pod answers. These are dashboard settings, which means they can be
      # changed by hand at any time; this is what stops that from going unnoticed.
      - name: Guard single-instance and volume configuration
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: ./scripts/bunny-guard.sh "${{ vars.BUNNY_APP_ID }}"

      # Deploys by immutable commit SHA, never :latest. That makes redeploys idempotent
      # and makes rollback the same call with an earlier SHA, rather than depending on
      # where a mutable tag happens to point.
      #
      # NOTE: this action is pinned to @main, which is what Bunny documents. It is a
      # mutable reference - the code executed here can change without a commit in this
      # repo. Pin to a commit SHA once a released version exists.
      - name: Roll app to the new image
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.BUNNY_APP_ID }}
          api_key: ${{ secrets.BUNNY_API_KEY }}
          container: ${{ vars.BUNNY_CONTAINER_NAME || 'app' }}
          image_tag: ${{ github.sha }}

      # "The API accepted the deploy" is not the same as "the site works". Magic
      # Containers pins to one region with one replica (SQLite is single-writer), so a
      # rollout replaces the only instance - if the new image is broken, the demo is down.
      #
      # This polls the live URL until it serves real content, and fails the job if it
      # never does. Without it a green pipeline can sit above a dead demo.
      - name: Verify the live site
        if: vars.BUNNY_APP_URL != ''
        run: |
          URL="${{ vars.BUNNY_APP_URL }}"
          echo "Waiting for $URL to serve the new build..."
          # Three gates, in order of what they rule out:
          #   /version == this commit  -> the NEW build is serving, not the outgoing one
          #   nav link present         -> the layout composed and the view rendered
          #   seeded customer present  -> the database came up, not just Kestrel
          #
          # The SHA gate is the one that matters. A previous version asserted only that a
          # nav link was present, which the OUTGOING container also served - so CI
          # reported a green deploy while the site was still showing the platform's
          # "We're deploying your app!" placeholder. Liveness is not freshness.
          for i in $(seq 1 40); do
            served="$(curl -sS --max-time 20 "$URL/version" 2>/dev/null | tr -d '[:space:]' || true)"
            if [[ "$served" != "${{ github.sha }}" ]]; then
              echo "  [$i] serving '${served:-<no response>}', want '${{ github.sha }}'"
              sleep 15
              continue
            fi
            echo "New build is serving (${{ github.sha }})."

            body="$(curl -sS --max-time 20 "$URL/" || true)"
            if [[ "$body" != *"/customer-management/list-all"* ]]; then
              echo "  [$i] correct build, page not rendering yet"
              sleep 15
              continue
            fi

            list="$(curl -sS --max-time 20 "$URL/customer-management/list-all" || true)"
            if [[ "$list" == *"Eduardo Pires"* ]]; then
              echo "Customer list is serving seeded data."
              exit 0
            fi
            echo "  [$i] correct build, database not ready yet"
            sleep 15
          done
          echo "::error::$URL did not serve the expected content within ~10 minutes"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- image: \`${{ github.sha }}\`"
            echo "- app:   \`${{ vars.BUNNY_APP_ID }}\`"
            [ -n "${{ vars.BUNNY_APP_URL }}" ] && echo "- url:   ${{ vars.BUNNY_APP_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
